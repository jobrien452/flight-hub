services:
  mongo:
    image: mongo:7
    ports:
      # loopback only, compass and mongosh still work from the host itself
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 60 # ~5 minutes at a 5s interval

  backend:
    build: ./backend
    ports:
      # loopback only, the public way in is https through nginx
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: flyby
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # relative + same-origin, nginx proxies /api to the backend container.
        # real visitors never see localhost:8000, which would be their own machine
        VITE_API_URL: /api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend

  # renews the cert certbot already issued, run init-letsencrypt.sh once first
  # to get that initial cert, this alone won't obtain one
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  mongo_data:
  certbot_conf:
  certbot_www:
