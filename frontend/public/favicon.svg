<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- flyby's mark, their wordmark trimmed down to the triangle for a 16px tab -->
  <rect width="64" height="64" rx="10" fill="#14171c"/>
  <defs>
    <clipPath id="mark">
      <polygon points="40,50 0,30 40,0"/>
    </clipPath>
  </defs>
  <g transform="translate(19.2 16) scale(0.64)">
    <g clip-path="url(#mark)" fill="#ffffff">
      <rect x="-7.7" y="15.9" width="54.5" height="4.5" transform="matrix(0.8 -0.5999 0.5999 0.8 -6.979 15.3567)"/>
      <polygon points="40,119.5 35.5,119.5 35.5,20.5 -2.7,49.2 -5.4,45.6 40,11.5"/>
    </g>
  </g>
</svg>
